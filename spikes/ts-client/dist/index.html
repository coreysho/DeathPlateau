<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>TS client - World 2</title>
<style>
  html, body { margin: 0; background: #000; color: #9a9a9a; font: 12px -apple-system, sans-serif; }
  #gameCanvas { display: block; width: 100vw; max-width: 100%; height: auto; image-rendering: pixelated; }
  #form { padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
  #form input { font-size: 16px; padding: 8px; flex: 1 1 120px; min-width: 0; background: #141414;
                color: #ddd; border: 1px solid #444; border-radius: 4px; }
  #form button { font-size: 16px; padding: 8px 16px; background: #1b1b1b; color: #c8a04a;
                 border: 1px solid #c8a04a; border-radius: 4px; }
  #log { padding: 8px; font: 12px ui-monospace, monospace; color: #7fe07f; line-height: 1.45; }
  #log div { white-space: pre-wrap; word-break: break-word; }
  #boot { padding: 8px; font: 12px ui-monospace, monospace; color: #ff8080; white-space: pre-wrap; }
</style></head>
<body>
<div id="boot">loading game.js ...</div>
<script>
(function () {
  var boot = document.getElementById('boot');
  function show(t) { boot.textContent = t; }
  window.addEventListener('error', function (e) {
    show('ERROR: ' + (e.message || e.type) + '\n' + (e.filename || '') + ':' + (e.lineno || '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    show('UNHANDLED REJECTION: ' + String(e.reason && e.reason.message || e.reason).slice(0, 300));
  });
  // NEVER THE CACHED ONE. A stale bundle looks exactly like a fix that did not work - it cost a
  // round already, reporting an error from a line number the new build does not even have.
  var s = document.createElement('script');
  s.src = '/ts/game.js?t=' + Date.now();
  s.onerror = function () { show('game.js FAILED TO LOAD - check the URL and file permissions'); };
  document.head.appendChild(s);
  window.addEventListener('load', function () {
    setTimeout(function () {
      if (!document.getElementById('log')) { show('game.js loaded but produced nothing.'); }
      else { boot.style.display = 'none'; }
    }, 3000);
  });
})();
</script>
</body></html>
